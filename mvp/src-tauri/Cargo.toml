[package]
name = "dictee"
version = "0.1.0"
description = "Dictée vocale locale, Privacy by Design"
edition = "2021"
publish = false

[lib]
# Le suffixe _lib évite un conflit de nom entre la lib et le binaire.
name = "dictee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["metal", "tracing_backend"] }
zeroize = "1"

[dev-dependencies]
hound = "3"

[profile.dev.package."*"]
# whisper.cpp et le DSP sont inutilisables en debug non optimisé.
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
